[user]
name = "Colin Chan"
email = "colin@pylonlending.com"

[ui]
default-command = "log"
pager = "less"

[aliases]
dup = ["duplicate"]
fetch = ["git", "fetch"]
top = ["new", "top"]
bottom = ["new", "bottom"]

[colors]
"diff color_words added" = { fg = "#83c758", bg = "#19350c" }
"diff color_words removed" = { fg = "#f97e70", bg = "#441a15" }
"diff color_words token" = { underline = false }
"diff color_words line_number" = { fg = "#45484b", bg = "default" }
"diff color_words context line_number" = { fg = "#45484b", bg = "default", dim = false }

[remotes.origin]
auto-track-bookmarks = "colin/*"

[revset-aliases]
tip = "latest(visible())"

# Stack navigation
current = "coalesce((@ & empty() & heads(@::))-, @)"
tops = "heads(current:: ~ empty() & visible())"
top = "exactly(tops, 1)"
bottoms = "roots(::current & mutable() & visible())"
bottom = "exactly(bottoms, 1)"
stack = "bottom::top"

# Allow changes with graphite-base/* bookmarks to remain mutable
"immutable_heads()" = "builtin_immutable_heads() ~ (bookmarks() & remote_bookmarks(graphite-base/*))"

[revsets]
bookmark-advance-to = "@-"
log-graph-prioritize = "coalesce(tops, trunk())"

[templates]
draft_commit_description = '''
if(description,
  builtin_draft_commit_description_with_diff,
  concat(commit_message_template, builtin_draft_commit_description_with_diff),
)
'''
file_annotate = "join(' ', commit.commit_id().short(8), pad_start(12, truncate_end(12, commit.author().timestamp().ago())), pad_start(9, truncate_end(9, commit.author().name())), pad_start(3, line_number), content)"
git_push_bookmark = '"colin/push-" ++ change_id.short()'

[template-aliases]
"format_short_signature(signature)" = "signature.name()"
"commit_message_template" = """'(no title)

## Overview



## Customer visible changes

N/A

## How did you test these changes?

- [ ]  The changes are fully covered by automated tests.
- [ ]  The changes cannot affect production.
- [ ]  I will manually test this functionality on every release until automated (<my playbook>).'
"""
